output_dir: ../artifacts/controlled-fixture
seed: 42
transformations:
- name: remove-location-link
  kind: missing_premise
  targets:
  - district
- name: opposed-location
  kind: contradiction
  targets:
  - district
  additions:
  - source:
      id: opposite
      uri: fixture://opposite
      title: opposite
      retrieved_at: '2026-10-01T00:00:00Z'
      source_type: benchmark
    text: The Rava district is not in the city of Merin; it is in the city of Solen.
- name: distractor
  kind: irrelevant
