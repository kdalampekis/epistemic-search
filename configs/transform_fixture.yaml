  - source:
      id: new
      uri: fixture://new
      title: new
      retrieved_at: '2026-10-01T00:00:00Z'
      source_type: benchmark
    text: As of 2026-01-01 the Luma institute headquarters is in Solen.
  evidence_dates:
    old: '2020-01-01'
    new: '2026-01-01'
