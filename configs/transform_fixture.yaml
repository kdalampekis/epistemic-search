      retrieved_at: '2026-10-01T00:00:00Z'
      source_type: benchmark
    text: The Luma institute cafeteria serves lentil soup.
- name: paraphrase
  kind: redundant
  targets:
  - district
  additions:
  - source:
      id: paraphrase
      uri: fixture://paraphrase
      title: paraphrase
      retrieved_at: '2026-10-01T00:00:00Z'
