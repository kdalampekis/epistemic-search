name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src tests
      - run: uv run --locked pytest
      - run: uv run --locked --extra benchmarks pytest tests/test_benchmarks.py
      - run: uv run --locked --extra formal pytest tests/test_formal.py
      - run: uv run --locked --extra formal epistemic-search compare-formal configs/formal_fixture.yaml
      - run: uv run --locked epistemic-search validate-config configs/foundation.yaml
      - run: uv run --locked epistemic-search run-naive configs/naive_fixture.yaml tests/fixtures/query.json /tmp/naive-run.json
      - run: uv run --locked epistemic-search evaluate configs/evaluation_fixture.yaml
      - run: uv run --locked epistemic-search selective artifacts/evaluation-fixture /tmp/selective.json
      - run: uv run --locked epistemic-search calibrate configs/calibration_fixture.yaml
      - run: uv run --locked epistemic-search transform configs/transform_fixture.yaml
      - run: uv run --locked epistemic-search evaluate configs/controlled_fixture.yaml
      - run: uv run --locked epistemic-search evaluate configs/iterative_fixture.yaml
      - run: uv run --locked epistemic-search decompose configs/decomposition_fixture.yaml tests/fixtures/decomposition_query.json /tmp/decomposition.json
      - run: uv run --locked epistemic-search evaluate configs/epistemic_fixture.yaml
      - run: uv run --locked epistemic-search evaluate configs/voi_fixture.yaml
      - run: uv run --locked epistemic-search compare configs/parity_fixture.yaml
      - run: uv run --locked epistemic-search ablate configs/ablation_fixture.yaml
      - run: uv build
