[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "epistemic-search"
version = "0.1.0"
description = "Research foundation for premise-aware, evidence-state-aware retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "typer>=0.15,<1",
]

[project.scripts]
epistemic-search = "epistemic_search.cli:app"

[project.optional-dependencies]
benchmarks = [
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1", "types-PyYAML>=6,<7"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
